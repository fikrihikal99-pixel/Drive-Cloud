<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - SDN Ciluar 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        if(localStorage.getItem("userRole") !== "admin") {
            alert("Akses ditolak! Khusus Admin.");
            window.location.href = "index.html";
        }
        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f6f3eb] min-h-screen flex flex-col md:flex-row p-3 md:p-4 gap-4 text-gray-800">

    <aside class="w-full md:w-72 bg-white md:bg-transparent rounded-2xl md:rounded-none p-4 md:p-0 flex flex-col justify-between shadow-sm md:shadow-none shrink-0">
        <div>
            <div class="flex items-center justify-between md:justify-start gap-3 mb-4 md:mb-8 px-1">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 md:w-12 md:h-12 bg-slate-800 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-md">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base md:text-lg leading-tight">Admin Panel</h1>
                        <p class="text-[11px] text-gray-600">SDN Ciluar 1 Cloud</p>
                    </div>
                </div>
                <button onclick="logout()" class="md:hidden text-red-500 p-2 text-sm"><i class="fa-solid fa-power-off"></i></button>
            </div>
            <button onclick="logout()" class="hidden md:flex items-center gap-2 text-red-500 hover:text-red-700 text-xs font-bold mt-4"><i class="fa-solid fa-power-off"></i> Keluar Sistem</button>
        </div>
    </aside>

    <main class="flex-1 bg-white rounded-2xl md:rounded-3xl shadow-sm p-4 md:p-8 flex flex-col overflow-hidden min-h-[75vh] md:min-h-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div>
                <h1 class="text-xl md:text-2xl font-bold mb-1">Manajemen Pengguna</h1>
                <p class="text-xs text-gray-500">Tambah atau hapus akun guru dan admin.</p>
            </div>
            <button onclick="bukaModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold shadow-sm transition flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Tambah Pengguna
            </button>
        </div>

        <div class="border border-gray-200 rounded-xl overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs md:text-sm">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-gray-600">
                        <th class="p-3 md:p-4 font-bold">Nama Lengkap</th>
                        <th class="p-3 md:p-4 font-bold">Username</th>
                        <th class="p-3 md:p-4 font-bold">Peran (Role)</th>
                        <th class="p-3 md:p-4 font-bold text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelUser">
                    <tr><td colspan="4" class="p-4 text-center text-gray-400">Memuat data pengguna...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL TAMBAH USER -->
    <div id="modalUser" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h2 class="text-lg font-bold mb-4">Tambah Akun Baru</h2>
            <form id="formTambah" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Nama Lengkap & Gelar</label>
                    <input type="text" id="inputNama" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs md:text-sm focus:outline-none focus:border-teal-500" placeholder="Contoh: Siti Aminah, S.Pd">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Username Login</label>
                    <input type="text" id="inputUser" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs md:text-sm focus:outline-none focus:border-teal-500" placeholder="Contoh: sitiaminah">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Kata Sandi</label>
                    <input type="password" id="inputPass" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs md:text-sm focus:outline-none focus:border-teal-500" placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Peran Akses</label>
                    <select id="inputRole" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs md:text-sm focus:outline-none focus:border-teal-500">
                        <option value="guru">Guru</option>
                        <option value="admin">Admin Sekolah</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="tutupModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold transition">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold transition">Simpan Akun</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQ4oUm9H7aRCg1u0DeeZ7jfO4t9rt8Jp25KfB1YXyEFE8dbOJwIFTD-lguF_OZImwxRQ/exec';

        function muatDataUser() {
            fetch(`${SCRIPT_URL}?action=getUsers`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "Sukses") {
                    let html = '';
                    res.data.forEach(u => {
                        let roleBadge = u.role === 'admin' ? 'bg-slate-800 text-white' : 'bg-teal-100 text-teal-800';
                        html += `
                        <tr class="border-b border-gray-100">
                            <td class="p-3 md:p-4 font-semibold">${u.nama}</td>
                            <td class="p-3 md:p-4 text-gray-500">${u.username}</td>
                            <td class="p-3 md:p-4"><span class="${roleBadge} px-2 py-0.5 rounded text-[10px] md:text-xs font-bold uppercase">${u.role}</span></td>
                            <td class="p-3 md:p-4 text-center">
                                ${u.username !== 'admin' ? `<button onclick="hapusUser('${u.username}')" class="text-red-500 hover:text-red-700 text-xs font-bold"><i class="fa-solid fa-trash"></i> Hapus</button>` : '<span class="text-gray-300 text-xs">Utama</span>'}
                            </td>
                        </tr>`;
                    });
                    document.getElementById('tabelUser').innerHTML = html;
                }
            });
        }

        function bukaModal() { document.getElementById('modalUser').classList.remove('hidden'); }
        function tutupModal() { document.getElementById('modalUser').classList.add('hidden'); }

        document.getElementById('formTambah').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append('action', 'tambahUser');
            formData.append('nama', document.getElementById('inputNama').value);
            formData.append('username', document.getElementById('inputUser').value);
            formData.append('password', document.getElementById('inputPass').value);
            formData.append('role', document.getElementById('inputRole').value);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                if(res.status === "Sukses") {
                    alert("Akun berhasil dibuat!");
                    tutupModal();
                    muatDataUser();
                    document.getElementById('formTambah').reset();
                } else {
                    alert("Gagal menambah akun.");
                }
            });
        });

        function hapusUser(username) {
            if(!confirm(`Yakin ingin menghapus akun ${username}?`)) return;
            const formData = new URLSearchParams();
            formData.append('action', 'hapusUser');
            formData.append('username', username);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                if(res.status === "Sukses") {
                    alert("Akun dihapus.");
                    muatDataUser();
                } else {
                    alert("Gagal menghapus.");
                }
            });
        }

        document.addEventListener("DOMContentLoaded", muatDataUser);
    </script>
</body>
</html>
