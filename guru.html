<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage - SDN Ciluar 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        if(localStorage.getItem("userRole") !== "guru") {
            alert("Akses ditolak! Silakan login terlebih dahulu.");
            window.location.href = "index.html";
        }
        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f6f3eb] min-h-screen flex flex-col md:flex-row p-3 md:p-4 gap-4 text-gray-800 overflow-x-hidden">

    <aside class="w-full md:w-72 bg-white md:bg-transparent rounded-2xl md:rounded-none p-4 md:p-0 flex flex-col justify-between shadow-sm md:shadow-none shrink-0">
        <div>
            <div class="flex items-center justify-between md:justify-start gap-3 mb-4 md:mb-8 px-1">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 md:w-12 md:h-12 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-md">
                        <i class="fa-solid fa-school"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base md:text-lg leading-tight">SDN Ciluar 1</h1>
                        <p class="text-[11px] text-gray-600">Pustaka Digital Guru</p>
                    </div>
                </div>
                <button onclick="logout()" class="md:hidden text-red-500 p-2 text-sm"><i class="fa-solid fa-power-off"></i></button>
            </div>

            <div class="bg-[#efead9] p-3 rounded-xl mb-4 hidden md:flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="https://ui-avatars.com/api/?name=Sri+Wahyuni&background=f97316&color=fff" class="w-9 h-9 rounded-full">
                    <div>
                        <h2 class="font-bold text-xs" id="namaGuruLaptop">Ibu Sri</h2>
                        <span class="text-[9px] bg-teal-600 text-white px-2 py-0.5 rounded-full">GURU</span>
                    </div>
                </div>
                <button onclick="logout()" title="Keluar" class="text-red-500 hover:text-red-700 text-sm"><i class="fa-solid fa-power-off"></i></button>
            </div>

            <nav class="flex md:flex-col gap-1 overflow-x-auto pb-2 md:pb-0 mb-2">
                <a href="#" onclick="loadFiles('all')" class="flex items-center gap-2 md:gap-3 bg-teal-600 text-white px-3 md:px-4 py-2 rounded-lg text-xs md:text-sm font-medium shrink-0"><i class="fa-solid fa-house w-4"></i> Dashboard</a>
                <a href="#" onclick="loadFiles('getAdministrasi')" class="flex items-center gap-2 md:gap-3 hover:bg-[#efead9] text-gray-700 px-3 md:px-4 py-2 rounded-lg text-xs md:text-sm transition shrink-0"><i class="fa-solid fa-folder w-4"></i> Administrasi</a>
                <a href="#" onclick="loadFiles('getBankSoal')" class="flex items-center gap-2 md:gap-3 hover:bg-[#efead9] text-gray-700 px-3 md:px-4 py-2 rounded-lg text-xs md:text-sm transition shrink-0"><i class="fa-solid fa-folder w-4"></i> Bank Soal</a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 bg-white rounded-2xl md:rounded-3xl shadow-sm p-4 md:p-8 flex flex-col overflow-hidden min-h-[75vh] md:min-h-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div>
                <h1 class="text-xl md:text-3xl font-bold text-gray-800">Halo, <span id="salamNama">Guru</span>!</h1>
                <p class="text-xs md:text-sm text-gray-600">Kelola file pembelajaran SDN Ciluar 1 dengan mudah.</p>
            </div>
            
            <div class="flex items-center gap-2 w-full md:w-auto">
                <button onclick="buatFolderBaru()" class="flex-1 md:flex-none bg-amber-500 hover:bg-amber-600 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold shadow-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-folder-plus"></i> Folder Baru
                </button>
                <button onclick="document.getElementById('fileInput').click()" class="flex-1 md:flex-none bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold shadow-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i> Unggah File
                </button>
                <input type="file" id="fileInput" class="hidden" onchange="uploadFile()">
            </div>
        </div>

        <div id="uploadStatus" class="hidden mb-4 p-3 bg-blue-50 text-blue-700 rounded-xl text-xs md:text-sm font-medium flex items-center gap-2">
            <i class="fa-solid fa-spinner fa-spin"></i> <span id="statusText">Sedang memproses...</span>
        </div>

        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm md:text-lg font-bold text-gray-800">Daftar File & Folder Drive</h3>
            <span class="text-xs text-gray-400">Sinkronisasi Otomatis</span>
        </div>

        <div id="fileContainer" class="grid grid-cols-1 md:grid-cols-3 gap-3 overflow-y-auto pb-4 pr-1">
            <div class="col-span-full text-center py-12 text-gray-400 text-sm">
                <i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i>
                <p>Memuat file dari Google Drive...</p>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPmlznlDdE4aIbOhzh4-jrVmhwpxLpqoZ_jfgAd5qKYqX2mHTmW26K3lGl3DsstJy7mw/exec';
        
        const namaUser = localStorage.getItem("userName") || "Guru";
        if(document.getElementById('namaGuruLaptop')) document.getElementById('namaGuruLaptop').innerText = namaUser;
        document.getElementById('salamNama').innerText = namaUser;

        function loadFiles(actionParam = 'all') {
            const container = document.getElementById('fileContainer');
            container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 text-sm"><i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i><p>Memuat data...</p></div>';

            fetch(`${SCRIPT_URL}?action=${actionParam}`)
            .then(res => res.json())
            .then(res => {
                if(res.status !== "Sukses" || !res.data || res.data.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 text-sm">Belum ada file atau folder di dalam Google Drive ini.</div>';
                    return;
                }
                let html = '';
                res.data.forEach(item => {
                    let isFolder = item.tipe === 'folder';
                    let iconClass = isFolder ? 'fa-folder text-amber-500' : 'fa-file-lines text-blue-500';
                    let bgClass = isFolder ? 'bg-amber-50' : 'bg-blue-50';
                    let sizeText = isFolder ? 'Direktori Folder' : (item.ukuran / (1024*1024)).toFixed(2) + ' MB';

                    html += `
                    <div class="border border-gray-100 rounded-2xl p-3.5 flex items-center justify-between bg-white shadow-sm hover:shadow transition">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 ${bgClass} rounded-xl flex items-center justify-center text-lg shrink-0">
                                <i class="fa-solid ${iconClass}"></i>
                            </div>
                            <div class="overflow-hidden">
                                <h4 class="font-bold text-xs md:text-sm text-gray-800 truncate" title="${item.nama}">${item.nama}</h4>
                                <p class="text-[10px] md:text-xs text-gray-400 mt-0.5">${sizeText} • ${item.tanggal}</p>
                            </div>
                        </div>
                        <a href="${item.url}" target="_blank" class="bg-gray-50 hover:bg-teal-50 text-gray-600 hover:text-teal-600 px-3 py-2 rounded-xl text-xs font-bold transition shrink-0 ml-2">
                            <i class="fa-solid fa-external-link-alt"></i> Buka
                        </a>
                    </div>`;
                });
                container.innerHTML = html;
            })
            .catch(() => {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-red-400 text-sm">Gagal memuat data. Periksa koneksi internet Anda.</div>';
            });
        }

        function buatFolderBaru() {
            const namaFolder = prompt("Masukkan nama folder baru:");
            if (!namaFolder) return;

            const statusDiv = document.getElementById('uploadStatus');
            const statusText = document.getElementById('statusText');
            statusDiv.classList.remove('hidden');
            statusText.innerText = `Membuat folder "${namaFolder}"...`;

            const formData = new URLSearchParams();
            formData.append('action', 'buatFolder');
            formData.append('namaFolder', namaFolder);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(result => {
                statusDiv.classList.add('hidden');
                if(result.status === "Sukses") {
                    alert("Folder berhasil dibuat!");
                    loadFiles('all');
                } else {
                    alert("Gagal membuat folder.");
                }
            })
            .catch(() => {
                statusDiv.classList.add('hidden');
                alert("Terjadi kesalahan jaringan.");
            });
        }

        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if(!file) return;

            const statusDiv = document.getElementById('uploadStatus');
            const statusText = document.getElementById('statusText');
            statusDiv.classList.remove('hidden');
            statusText.innerText = `Mengunggah ${file.name} (Mohon tunggu)...`;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result.split(',')[1];
                const formData = new URLSearchParams();
                formData.append('action', 'upload');
                formData.append('fileData', base64);
                formData.append('mimeType', file.type);
                formData.append('fileName', file.name);

                fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(result => {
                    statusDiv.classList.add('hidden');
                    fileInput.value = '';
                    if(result.status === "Sukses") {
                        alert("File berhasil diunggah ke Google Drive!");
                        loadFiles('all');
                    } else {
                        alert("Gagal mengunggah file.");
                    }
                })
                .catch(() => {
                    statusDiv.classList.add('hidden');
                    alert("Gagal terhubung ke server saat upload.");
                });
            };
            reader.readAsDataURL(file);
        }

        document.addEventListener("DOMContentLoaded", () => loadFiles('all'));
    </script>
</body>
</html>
